# Render Free: web-only service. Turso/libSQL holds the queue; Vercel Blob
# holds uploads and clips because Free instances cannot attach a disk.
services:
  - type: web
    name: clipforge
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: CLIP_STORAGE
        value: blob
      - key: WORKER_DISABLED
        value: "1"
      - key: HF_HOME
        value: /tmp/hf-cache
      - key: WHISPER_MODEL
        value: base
      - key: POLL_SECONDS
        value: "3"
      - key: WORK_ROOT
        value: /tmp/work
      - key: CLIPS_ROOT
        value: /tmp/clips
      - key: MIN_CLIP_SECONDS
        value: "16"
      - key: MAX_CLIP_SECONDS
        value: "52"
      - key: TARGET_CLIP_SECONDS
        value: "30"
